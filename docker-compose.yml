services:

    # ========================= Laravel App =========================
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'laravel.test'
        container_name: trade_hub_app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - trade_hub_network
        depends_on:
            - mysql
            - redis
            - meilisearch
            - mailpit
            - selenium

    # ========================= MySQL =========================
    mysql:
        image: 'mysql/mysql-server:8.0'
        container_name: trade_hub_mysql
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: "${MYSQL_EXTRA_OPTIONS:-}"
        volumes:
            - 'trade-hub-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - trade_hub_network
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD}']
            retries: 3
            timeout: 5s

    # ======================== Redis ==========================
    redis:
        image: 'redis:alpine'
        container_name: trade_hub_redis
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'trade-hub-redis:/data'
        networks:
            - trade_hub_network
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 3
            timeout: 5s

    # ===================== MeiliSearch =======================
    meilisearch:
        image: 'getmeili/meilisearch:latest'
        container_name: trade_hub_meilisearch
        ports:
            - '${FORWARD_MEILISEARCH_PORT:-7700}:7700'
        environment:
            MEILI_NO_ANALYTICS: '${MEILISEARCH_NO_ANALYTICS:-false}'
        volumes:
            - 'trade-hub-meilisearch:/meili_data'
        networks:
            - trade_hub_network
        healthcheck:
            test: ['CMD', 'wget', '--no-verbose', '--spider', 'http://127.0.0.1:7700/health']
            retries: 3
            timeout: 5s

    # ======================== Mailpit =========================
    mailpit:
        image: 'axllent/mailpit:latest'
        container_name: trade_hub_mailpit
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - trade_hub_network

    # ======================== Selenium =========================
    selenium:
        image: selenium/standalone-chromium
        container_name: trade_hub_selenium
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - '/dev/shm:/dev/shm'
        networks:
            - trade_hub_network

    # ======================= phpMyAdmin ========================
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        platform: linux/amd64
        container_name: trade_hub_phpmyadmin
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
        ports:
            - 8080:80
        networks:
            - trade_hub_network
        depends_on:
            - mysql

# ========================= Networks ==========================
networks:
    trade_hub_network:
        driver: bridge

# ========================== Volumes ===========================
volumes:
    trade-hub-mysql:
        driver: local
    trade-hub-redis:
        driver: local
    trade-hub-meilisearch:
        driver: local